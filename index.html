<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marriage Rummy Online</title>

    <!-- IMPORTANT: Must be a module so import.meta.env works -->
    <script type="module">
      window.__FIREBASE_CONFIG__ = {
        apiKey:            import.meta?.env?.VITE_FIREBASE_API_KEY,
        authDomain:        import.meta?.env?.VITE_FIREBASE_AUTH_DOMAIN,
        databaseURL:       import.meta?.env?.VITE_FIREBASE_DATABASE_URL,
        projectId:         import.meta?.env?.VITE_FIREBASE_PROJECT_ID,
        storageBucket:     import.meta?.env?.VITE_FIREBASE_STORAGE_BUCKET,
        messagingSenderId: import.meta?.env?.VITE_FIREBASE_MESSAGING_SENDER_ID,
        appId:             import.meta?.env?.VITE_FIREBASE_APP_ID,
        // optional:
        measurementId:     import.meta?.env?.VITE_FIREBASE_MEASUREMENT_ID
      };

      // Help confirm the bridge is working during troubleshooting:
      console.log("FIREBASE_CONFIG", window.__FIREBASE_CONFIG__);
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- ALSO a module: load your React entry correctly -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
