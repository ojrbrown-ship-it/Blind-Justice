<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blind Justice</title>
    <style>
      :root { color-scheme: light dark; }
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin:0; background:#f7f7f7; color:#111; }
      .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
      button { cursor: pointer; }
      .grid { display:grid; gap:12px; }
      .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
      .card { border:1px solid #bbb; padding:6px 8px; border-radius:6px; background:#fff; color:#111; }
      .wild { outline: 2px solid #e67e22; }
      .meld { border:1px dashed #888; padding:6px; border-radius:6px; background:#fff; }
      .pill { padding:2px 8px; border-radius:999px; border:1px solid #aaa; background:#fff; }
      .danger { background:#ffecec; border-color:#ff8e8e; }
      .success { background:#e7ffe7; border-color:#8eff8e; }
      .muted { opacity:.75 }
      .panel { border:1px solid #ddd; border-radius:8px; padding:12px; background:#fff; }
      .fixedbar { position:sticky; bottom:0; display:flex; gap:8px; padding:8px; background:#fff; border-top:1px solid #ddd; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
